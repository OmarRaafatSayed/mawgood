<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Category Products API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
        .product img { max-width: 200px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test Category Products API</h1>
    <button onclick="testAPI()">Test API: /api/categories/9/products</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('/api/categories/9/products');
                const data = await response.json();
                
                if (data.products && data.products.length > 0) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h2>✓ Success! Found ${data.products.length} product(s)</h2>
                            <h3>Category: ${data.category.name}</h3>
                        </div>
                        ${data.products.map(p => `
                            <div class="product">
                                <h4>${p.name}</h4>
                                <p>Price: ${p.price} EGP</p>
                                <p>In Stock: ${p.in_stock ? 'Yes' : 'No'}</p>
                                ${p.images.length > 0 ? `<img src="${p.images[0].url}" alt="${p.name}">` : ''}
                            </div>
                        `).join('')}
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="error"><h2>✗ No products found</h2></div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><h2>✗ Error: ${error.message}</h2></div>`;
            }
        }
    </script>
</body>
</html>
