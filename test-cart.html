<!DOCTYPE html>
<html>
<head>
    <title>Test Cart</title>
</head>
<body>
    <button onclick="testCart()">Test Add to Cart</button>
    
    <script>
    function testCart() {
        fetch('http://localhost:8000/api/checkout/cart', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                product_id: 1,
                quantity: 1
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log('Success:', data);
            alert('Cart response: ' + JSON.stringify(data));
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error: ' + error);
        });
    }
    </script>
</body>
</html>
