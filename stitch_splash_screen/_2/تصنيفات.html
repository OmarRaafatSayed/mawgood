    .iphone-frame {

      height: 852px;
      border: 8px solid #1a1a1a;

      overflow: hidden;
      position: relative;
      margin: 20px auto;
      background: white;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .dynamic-island {
      width: 120px;
      height: 35px;
      background: black;
      border-radius: 20px;
      margin: 0 auto;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .category-card-shadow {
